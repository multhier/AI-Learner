# Kıvılcım + SQL Server 2022'yi tek komutla çalıştırır:
#   cp .env.example .env   (şifreyi değiştirin)
#   docker compose up -d --build
# Site: http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD .env dosyasında tanımlı olmalı}"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./Kivilcim
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db;Database=Kivilcim;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Database__SeedDemoData: "${SEED_DEMO_DATA:-false}"
      # Şifremi unuttum e-postaları için SMTP (boşsa e-postalar konteyner içinde dosyaya yazılır)
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__UserName: "${SMTP_USER:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__From: "${SMTP_FROM:-noreply@kivilcim.local}"
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqldata:
  uploads:
  keys:
